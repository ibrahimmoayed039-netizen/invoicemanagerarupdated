# كل رفعة (push) على main تبني **الملفين مع بعض**: تطبيق سطح المكتب (Electron/Windows)
# وتطبيق أندرويد (Kotlin/APK) — ثم ترفعهم كـ Release واحد فيه الملفين جاهزين للتحميل.

name: Build Desktop + Android

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-desktop:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Build Windows installer
        run: npm run dist:win

      - name: Upload Windows installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: invoice-manager-desktop-windows-${{ github.run_number }}
          path: desktop/dist/*.exe

  build-android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: invoice-manager-android-${{ github.run_number }}
          path: android/app/build/outputs/apk/debug/app-debug.apk

  release:
    needs: [ build-desktop, build-android ]
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows installer artifact
        uses: actions/download-artifact@v4
        with:
          name: invoice-manager-desktop-windows-${{ github.run_number }}
          path: release-files

      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: invoice-manager-android-${{ github.run_number }}
          path: release-files

      - name: Create combined GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "دفتر الفواتير — نسخة ${{ github.run_number }} (سطح المكتب + أندرويد)"
          files: release-files/**
