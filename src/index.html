<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self';" />
<title>إدارة الفواتير والعملاء</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>

  <div id="app">
    <!-- الشريط الجانبي -->
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark">ف</div>
        <div class="brand-text">
          <span class="brand-title" id="brandCompanyName">دفتر الفواتير</span>
          <span class="brand-sub">إدارة العملاء والمستحقات</span>
        </div>
      </div>

      <nav class="nav">
        <button class="nav-item active" data-view="dashboard">
          <svg viewBox="0 0 24 24" class="nav-icon"><path d="M4 13h6V4H4v9Zm0 7h6v-5H4v5Zm10 0h6V11h-6v9Zm0-16v5h6V4h-6Z"/></svg>
          <span>لوحة التحكم</span>
        </button>
        <button class="nav-item" data-view="customers">
          <svg viewBox="0 0 24 24" class="nav-icon"><path d="M12 12a4.5 4.5 0 1 0 0-9 4.5 4.5 0 0 0 0 9Zm0 2c-4 0-8 2-8 5v2h16v-2c0-3-4-5-8-5Z"/></svg>
          <span>العملاء</span>
        </button>
        <button class="nav-item" data-view="sales">
          <svg viewBox="0 0 24 24" class="nav-icon"><path d="M4 4h13l3 5-9.5 11L2 9l2-5Zm2.5 2L5 9l7 8.5L18.5 9l-1.5-3h-9Z"/></svg>
          <span>فواتير البيع</span>
        </button>
        <button class="nav-item" data-view="dues">
          <svg viewBox="0 0 24 24" class="nav-icon"><path d="M12 2 2 7l10 5 10-5-10-5Zm0 8L2 15l10 5 10-5-10-5Z"/></svg>
          <span>تسديد العملاء</span>
        </button>
        <button class="nav-item" data-view="history">
          <svg viewBox="0 0 24 24" class="nav-icon"><path d="M12 3a9 9 0 1 0 9 9h-2a7 7 0 1 1-2.05-4.95L14 10h7V3l-2.6 2.6A9 9 0 0 0 12 3Zm-1 5v5l4 2 .8-1.5L13 12V8h-2Z"/></svg>
          <span>السجل والتاريخ</span>
        </button>
        <button class="nav-item" data-view="settings">
          <svg viewBox="0 0 24 24" class="nav-icon"><path d="M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8Zm8.4 3-1-.2a6.9 6.9 0 0 0-.7-1.7l.6-.9a1 1 0 0 0-.1-1.3l-1.1-1.1a1 1 0 0 0-1.3-.1l-.9.6a6.9 6.9 0 0 0-1.7-.7l-.2-1a1 1 0 0 0-1-.8h-1.6a1 1 0 0 0-1 .8l-.2 1a6.9 6.9 0 0 0-1.7.7l-.9-.6a1 1 0 0 0-1.3.1L4.2 7a1 1 0 0 0-.1 1.3l.6.9a6.9 6.9 0 0 0-.7 1.7l-1 .2a1 1 0 0 0-.8 1v1.6a1 1 0 0 0 .8 1l1 .2c.15.6.4 1.17.7 1.7l-.6.9a1 1 0 0 0 .1 1.3l1.1 1.1a1 1 0 0 0 1.3.1l.9-.6c.53.3 1.1.55 1.7.7l.2 1a1 1 0 0 0 1 .8h1.6a1 1 0 0 0 1-.8l.2-1c.6-.15 1.17-.4 1.7-.7l.9.6a1 1 0 0 0 1.3-.1l1.1-1.1a1 1 0 0 0 .1-1.3l-.6-.9c.3-.53.55-1.1.7-1.7l1-.2a1 1 0 0 0 .8-1v-1.6a1 1 0 0 0-.8-1Z"/></svg>
          <span>الإعدادات</span>
        </button>
      </nav>

      <div class="sidebar-footer">نسخة 1.0.0</div>
    </aside>

    <!-- المحتوى الرئيسي -->
    <main class="content">
      <header class="topbar">
        <h1 id="pageTitle">لوحة التحكم</h1>
        <div class="global-search" id="globalSearch">
          <input id="globalSearchInput" class="input search-input" type="text" placeholder="بحث عن عميل أو رقم فاتورة…" autocomplete="off" />
          <div id="globalSearchResults" class="global-search-results hidden"></div>
        </div>
        <div id="topbarActions" class="topbar-actions"></div>
      </header>

      <div class="view-area" id="viewArea">
        <!-- تُبنى محتويات كل صفحة ديناميكياً عبر app.js -->
      </div>
    </main>
  </div>

  <!-- طبقة النوافذ المنبثقة (نماذج الإضافة/التعديل) -->
  <div id="modalRoot" class="modal-root hidden"></div>

  <!-- منطقة معاينة الطباعة -->
  <div id="printPreviewRoot" class="print-preview-root hidden">
    <div class="print-preview-backdrop"></div>
    <div class="print-preview-panel">
      <div class="print-preview-toolbar">
        <div class="ppt-title">معاينة الطباعة</div>
        <div class="ppt-actions">
          <button id="ppCancelBtn" class="btn btn-ghost">إغلاق</button>
          <button id="ppPdfBtn" class="btn btn-ghost">⭳ حفظ PDF</button>
          <button id="ppPrintBtn" class="btn btn-primary">🖨 طباعة</button>
        </div>
      </div>
      <div class="print-preview-scroll">
        <div id="printArea" class="print-sheet"></div>
      </div>
    </div>
  </div>

  <div id="toastRoot" class="toast-root"></div>

  <script src="app.js"></script>
</body>
</html>
